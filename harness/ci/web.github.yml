# CI — static fallback for `web` projects.
# Prefer `./bin/wf harness ci`, which GENERATES this from harness.signals.
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint --if-present
      - name: typecheck
        run: npm run typecheck --if-present
      - name: test
        run: npm test --if-present
      - name: build
        run: npm run build --if-present
