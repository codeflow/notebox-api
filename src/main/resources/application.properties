# === Notebox API — application configuration ===
# Operational secrets (DB credentials, JWT keys) come from env / secret manager in real
# environments (C-05). The values here are safe defaults for local dev and tests only.

# --- Datasource (MySQL) ---
quarkus.datasource.db-kind=mysql
# Production connection is injected via env: QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD.
# In dev/test with no URL set, Quarkus Dev Services starts a MySQL container automatically.
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://localhost:3306/notebox}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:notebox}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:notebox}

# --- Hibernate ORM ---
# Prod: schema owned by Flyway migrations, Hibernate only validates.
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true
# Dev/test: let Dev Services provision MySQL; Flyway still runs the real migrations.
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.log.sql=false

# --- JWT (RS256, MicroProfile JWT) ---
# The committed publicKey.pem/privateKey.pem are DEV/TEST ONLY. In prod the key locations MUST come
# from the environment (secret-mounted paths) — never the committed keys (C-05). See .env.example.
mp.jwt.verify.issuer=https://notebox.api
%dev.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.publickey.location=publicKey.pem
%prod.mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION}
%dev.smallrye.jwt.sign.key.location=privateKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
%prod.smallrye.jwt.sign.key.location=${SMALLRYE_JWT_SIGN_KEY_LOCATION}
# Access-token lifetime (seconds) — default 60 min (plan D-7); override via env in prod.
notebox.jwt.ttl-seconds=${NOTEBOX_JWT_TTL_SECONDS:3600}
notebox.jwt.issuer=https://notebox.api

# --- HTTP ---
quarkus.http.root-path=/api

# --- i18n ---
notebox.i18n.default-locale=en
notebox.i18n.supported-locales=en,pt
