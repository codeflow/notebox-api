# === Notebox API — application configuration ===
# Operational secrets (DB credentials, JWT keys) come from env / secret manager in real
# environments (C-05). The values here are safe defaults for local dev and tests only.

# --- Datasource (MySQL) ---
quarkus.datasource.db-kind=mysql
# Production connection is injected via env: QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD.
# In dev/test with no URL set, Quarkus Dev Services starts a MySQL container automatically.
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://localhost:3306/notebox}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:notebox}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:notebox}

# --- Hibernate ORM ---
# Prod: schema owned by Flyway migrations, Hibernate only validates.
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true
# Dev/test: let Dev Services provision MySQL; Flyway still runs the real migrations.
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true
# Test: validate every entity mapping against the Flyway-created schema on boot, so an
# entity↔migration divergence fails the suite instead of surfacing in production (audit F7).
%test.quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# --- JWT (RS256, MicroProfile JWT) ---
# The committed publicKey.pem/privateKey.pem are DEV/TEST ONLY. In prod the key locations MUST come
# from the environment (secret-mounted paths) — never the committed keys (C-05). See .env.example.
mp.jwt.verify.issuer=https://notebox.api
%dev.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.publickey.location=publicKey.pem
%prod.mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION}
%dev.smallrye.jwt.sign.key.location=privateKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
%prod.smallrye.jwt.sign.key.location=${SMALLRYE_JWT_SIGN_KEY_LOCATION}
# Access-token lifetime (seconds) — default 60 min (plan D-7); override via env in prod.
notebox.jwt.ttl-seconds=${NOTEBOX_JWT_TTL_SECONDS:3600}
notebox.jwt.issuer=https://notebox.api

# --- HTTP ---
quarkus.http.root-path=/api

# --- i18n ---
notebox.i18n.default-locale=en
notebox.i18n.supported-locales=en,pt

# --- Images (feature 003, AD-04) ---
# Max upload size in bytes (5 MB, NFR-04) and the allowed content types (C-07).
notebox.image.max-bytes=5242880
notebox.image.allowed-content-types=image/png,image/jpeg,image/gif,image/webp
# Raw image uploads can be up to the max above; lift the default request body limit accordingly.
quarkus.http.limits.max-body-size=6M

# --- Secret-value encryption (feature 005, AD-14) ---
# Versioned AES-256 keyring for Secret annotation-field values. dev/test default only — %prod
# overrides from the secret manager via env (C-05). Never commit a real key.
notebox.crypto.active-key-version=1
notebox.crypto.keys.1=${NOTEBOX_CRYPTO_KEY_1:5+PDNZdHa9DGV4g8P5FiZRyst3nLKZZZQszWOmbd1s8=}
%prod.notebox.crypto.keys.1=${NOTEBOX_CRYPTO_KEY_1}

# Dev-only CORS so the notebox-web dev server (localhost:3000) can call the API — never active in prod.
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:3000
%dev.quarkus.http.cors.headers=accept,authorization,content-type
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# The client is served from its own origin and talks to this API directly, so CORS is required in
# production too — without it the browser blocks every call and the app is unusable. The allowed
# origin is NOT wildcarded: a deployment states the origin its client is served from.
%prod.quarkus.http.cors=true
%prod.quarkus.http.cors.origins=${NOTEBOX_CORS_ORIGINS:http://localhost:3000}
%prod.quarkus.http.cors.headers=accept,authorization,content-type
%prod.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Batch the lazy value/option loads of a listing page into IN-queries (feat-008 plan §5) —
# avoids the join-fetch-with-pagination trap; global and reversible.
quarkus.hibernate-orm.unsupported-properties."hibernate.default_batch_fetch_size"=64

# Whether this deployment accepts new organizations through POST /organizations. A deployment that
# provisions organizations by other means sets this false and the endpoint refuses (403).
notebox.signup.enabled=${NOTEBOX_SIGNUP_ENABLED:true}
