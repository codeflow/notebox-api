# Annotation records (feature 005) — dot-namespaced keys (constitution §Naming)
annotation.record.name.required=The record name is required.
annotation.record.not_found=The annotation record was not found.
annotation.record.field.unknown=This value targets a field the annotation type does not define.
annotation.record.value.type_mismatch=The value does not match the field's type.
annotation.record.value.number.out_of_bounds=The number value is outside the field's allowed range.
annotation.record.value.option.unknown=The value does not reference one of the field's predefined options.
annotation.record.value.image.not_found=The referenced image was not found.
annotation.record.secret.reveal.forbidden=You do not have permission to reveal this secret value.
annotation.record.reveal.not_secret=This field is not a Secret field with a stored value.
annotation.record.value.duplicate_field=Each field can have at most one value in a record.
annotation.record.value.required=Each entry in values must be a value object, not null.
annotation.record.name.too_long=The record name must be at most 120 characters.
annotation.record.value.too_long=The value exceeds the maximum allowed length for this field.

# Record listing (feat-008)
annotation.record.list.type.required=A type id is required to list records
annotation.record.list.size.out_of_bounds=The page size must be between 1 and 200

# Tasks (feat-010)
task.name.required=The task name is required.
task.name.too_long=The task name must be at most 120 characters.
task.priority.required=The task priority is required.
task.priority.invalid=The priority must be one of Low, Medium, High or Critical.
task.status.not_writable=The task status is derived from its subtasks and cannot be set directly.
