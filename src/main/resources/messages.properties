# Annotation types (feature 003) — dot-namespaced keys (constitution §Naming)
validation.failed=The request contains invalid fields.
annotation.type.name.required=The annotation type name is required.
annotation.type.name.taken=An annotation type with this name already exists.
annotation.type.not_found=The annotation type was not found.
annotation.field.name.required=The field name is required.
annotation.field.option.label.required=The option label is required.
annotation.field.type.unknown=The field type is not one of the supported types.
annotation.field.options.not_allowed=Options are only allowed on List, Single choice and Multiple choice fields.
annotation.field.option.colour.invalid=The badge colour is invalid or not allowed for this field.
annotation.field.number.bounds.invalid=The minimum must not be greater than the maximum.
annotation.field.secret.not_allowed=The Secret flag is only allowed on Text and Free text fields.
annotation.image.too_large=The image exceeds the maximum allowed size.
annotation.image.type.unsupported=The image format is not supported.
annotation.image.not_found=The image was not found.
annotation.type.has_records=This annotation type cannot be deleted while it still has records.
annotation.type.field.has_records=A field cannot be removed or have its type changed while the annotation type still has records.
