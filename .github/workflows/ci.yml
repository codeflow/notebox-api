# CI — notebox-api
# Generated by `wf harness ci` from harness.signals. Re-run it after changing signals.
# Each signal is a separate step; edit commands with `wf harness signal <name> "<cmd>"`.
name: ci
on:
  push: { branches: ['main', 'develop', 'feature/**'] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21', cache: 'maven' }
      - name: lint
        run: echo 'lint: Checkstyle/Spotless not yet wired (tracked as F3); placeholder passes'
      - name: typecheck
        run: mvn -B compile
      - name: test
        run: mvn -B test
      - name: build
        run: mvn -B package
